<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relics Tier List</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
    <style>
 body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    padding-top: 50px; /* Ajuste para el menú fijo */
}

/* Barra de navegación */
nav {
    background-color: #007bff;
    color: white;
    padding: 10px;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
}

nav .nav-links {
    list-style: none;
    display: flex;
    gap: 15px;
    margin: 0;
    padding: 0;
}

nav .nav-links a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav .nav-links a:hover {
    text-decoration: underline;
}

/* Encabezado */
header {
    background-color: #007bff;
    color: white;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
}

/* Contenedor de tiers */
.tier-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 20px;
}

/* Filas de tiers */
.tier-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px;
    background-color: #e0e0e0;
    border: 2px solid #ccc;
    border-radius: 5px;
    min-height: 100px;
    position: relative;
}

/* Edición de título de tiers */
.tier-row h2 {
    margin: 0;
    width: 100px;
    text-align: center;
    cursor: pointer;
}

.tier-row h2[contenteditable="true"] {
    border: 1px dashed #007bff;
    padding: 2px;
}

/* Botón de eliminar tier */
.tier-row .delete-tier-button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    padding: 5px 10px;
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.tier-row .delete-tier-button:hover {
    background-color: #cc0000;
}

/* Contenedor de cartas */
.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

/* Estilos específicos para tarjetas */
.card {
    padding: 12px;
    background-color: #000; /* Fondo negro permanente */
    color: white; /* Texto blanco siempre */
    border: 1px solid #ccc;
    border-radius: 5px;
    cursor: grab;
    text-align: center;
    width: 120px;
    transition: background-color 0.3s, transform 0.2s;
}

/* Efecto visual al arrastrar */
.card.dragging {
    opacity: 0.5;
    transform: scale(1.1);
}

/* Estilos de imagen dentro de la tarjeta */
.card img {
    width: 100%;
    height: auto;
    border-radius: 5px;
}

/* Botón para agregar tier */
.add-tier-button {
    margin: 20px;
    padding: 12px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.add-tier-button:hover {
    background-color: #0056b3;
}

/* Botón de alternar tema */
#toggleThemeButton {
    position: fixed;
    bottom: 10px;
    right: 10px;
    padding: 6px 12px;
    font-size: 14px;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
}

#toggleThemeButton:hover {
    background-color: #0056b3;
}

/* Contenedor de cartas para las reliquias */
#AdventuresCardsContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px;
    justify-content: center;
}

/* Aplicación de modo oscuro sin afectar las tarjetas */
.dark-theme-card {
    background-color: #333;
    color: white;
}

    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="top-nav">
        <ul class="nav-links">
            <li><a href="./coming_soon.html">Wiki</a></li>
            <li><a href="./tiermaker.html">TierMaker</a></li>
            <li><a href="./RandomLorPocSelector.html">Randomiser</a></li>
        </ul>
    </nav>

    <header>
        <h1 id="tierTitle"></h1>
    </header>
    <main>
        <button class="add-tier-button" id="addTierButton">Add Tier</button>
        <div class="tier-container" id="tierContainer">
            <!-- Tier rows -->
            <div class="tier-row" data-tier="S">
                <h2 contenteditable="true">S</h2>
                <div class="card-container"></div>
                <button class="delete-tier-button">Delete</button>
            </div>
            <div class="tier-row" data-tier="A">
                <h2 contenteditable="true">A</h2>
                <div class="card-container"></div>
                <button class="delete-tier-button">Delete</button>
            </div>
            <div class="tier-row" data-tier="B">
                <h2 contenteditable="true">B</h2>
                <div class="card-container"></div>
                <button class="delete-tier-button">Delete</button>
            </div>
            <div class="tier-row" data-tier="C">
                <h2 contenteditable="true">C</h2>
                <div class="card-container"></div>
                <button class="delete-tier-button">Delete</button>
            </div>
        </div>

        <!-- Initial cards -->
        <div class="card-container" id="RelicCardsContainer"></div>
    </main>

    <!-- Theme Toggle Button -->
    <button id="toggleThemeButton" onclick="toggleTheme()">Switch Theme</button>

    <script type="module">
  import { relics } from './relics.js';

// Display the title saved in localStorage
document.getElementById("tierTitle").textContent = localStorage.getItem("tierTitle") || "Relics Tier List";

// Populate Relic cards
const relicsCardsContainer = document.getElementById("RelicCardsContainer");

relics.forEach(relic => {
    const card = document.createElement("div");
    card.classList.add("card");
    card.setAttribute("draggable", "true");

    const img = document.createElement("img");
    img.src = relic.image;
    img.alt = relic.name;

    const name = document.createElement("p");
    name.textContent = relic.name;

    card.appendChild(img);
    card.appendChild(name);
    relicsCardsContainer.appendChild(card);

    // Add drag and drop functionality
    card.addEventListener("dragstart", () => {
        card.classList.add("dragging");
    });

    card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
    });
});

// Drag and Drop functionality for tiers
const rows = document.querySelectorAll(".tier-row");

rows.forEach(row => {
    row.addEventListener("dragover", e => {
        e.preventDefault();
        const draggingCard = document.querySelector(".dragging");
        row.querySelector(".card-container").appendChild(draggingCard);
    });
});

// Add new tiers dynamically
const tierContainer = document.getElementById("tierContainer");
const addTierButton = document.getElementById("addTierButton");

addTierButton.addEventListener("click", () => {
    const newTierRow = document.createElement("div");
    newTierRow.classList.add("tier-row");
    newTierRow.setAttribute("data-tier", "New");

    const deleteButton = document.createElement("button");
    deleteButton.classList.add("delete-tier-button");
    deleteButton.textContent = "Delete";

    const newTierTitle = document.createElement("h2");
    newTierTitle.textContent = "New Tier";
    newTierTitle.setAttribute("contenteditable", "true");

    const cardContainer = document.createElement("div");
    cardContainer.classList.add("card-container");

    // Apply dark mode if active
    if (document.body.classList.contains("dark-theme")) {
        newTierRow.classList.add("dark-theme-card");
        cardContainer.classList.add("dark-theme-card");
    }

    deleteButton.addEventListener("click", () => {
        newTierRow.remove();
    });

    newTierRow.appendChild(newTierTitle);
    newTierRow.appendChild(cardContainer);
    newTierRow.appendChild(deleteButton);
    tierContainer.appendChild(newTierRow);

    newTierRow.addEventListener("dragover", e => {
        e.preventDefault();
        const draggingCard = document.querySelector(".dragging");
        cardContainer.appendChild(draggingCard);
    });
});
function toggleTheme() {
    document.body.classList.toggle("dark-theme");

    const relicCards = document.querySelectorAll(".card");

    if (document.body.classList.contains("dark-theme")) {
        relicCards.forEach(card => card.classList.add("dark-theme-card"));
    } else {
        relicCards.forEach(card => card.classList.remove("dark-theme-card"));
    }
}


// Add delete functionality to existing tiers
document.querySelectorAll(".delete-tier-button").forEach(button => {
    button.addEventListener("click", e => {
        e.target.parentElement.remove();
    });
});



    </script>
</body>
</html>
